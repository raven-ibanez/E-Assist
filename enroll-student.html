<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Step 1: Student Information — BSSMAI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="biodata-page">
    <div class="page">
        <div class="biodata-header">
            <a href="index.html" class="biodata-back-link">
                <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
                Back to Home
            </a>
            <div class="biodata-logo">
                <img src="logo.png" alt="BSSMAI Logo" style="width:100%;height:100%;object-fit:contain;border-radius:50%;">
            </div>
            <h1>ENROLLMENT FORM</h1>
            <p>Nursery to Grade 6</p>
        </div>

        <!-- Step Tracker added to Step 1 -->
        <div class="step-tracker">
            <div class="step-item active">
                <div class="step-number">1</div>
                <div class="step-label">Student</div>
            </div>
            <div class="step-item">
                <div class="step-number">2</div>
                <div class="step-label">Parent</div>
            </div>
            <div class="step-item">
                <div class="step-number">3</div>
                <div class="step-label">Docs</div>
            </div>
            <div class="step-item">
                <div class="step-number">4</div>
                <div class="step-label">Payment</div>
            </div>
        </div>

        <div id="alert" class="alert" style="max-width:800px;margin:0 auto 20px;"></div>

        <div class="biodata-card">
            <form id="step1Form">
                <div class="form-section">
                    <h3>1. Student Information</h3>
                    <p class="form-step-hint">Step 1 of 4: Please provide the student's basic details.</p>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="last_name">Last Name *</label>
                            <input type="text" id="last_name" name="last_name" required>
                        </div>
                        <div class="form-group">
                            <label for="first_name">First Name *</label>
                            <input type="text" id="first_name" name="first_name" required>
                        </div>
                        <div class="form-group" style="flex:1.5;">
                            <label for="middle_name">Middle Name</label>
                            <input type="text" id="middle_name" name="middle_name">
                        </div>
                        <div class="form-group" style="flex:0.5;">
                            <label for="suffix">Suffix</label>
                            <input type="text" id="suffix" name="suffix" placeholder="e.g. Jr.">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="birth_date">Date of Birth *</label>
                            <input type="date" id="birth_date" name="birth_date" required>
                        </div>
                        <div class="form-group" style="flex:0.5;">
                            <label for="age">Age</label>
                            <input type="text" id="age" name="age" readonly class="input-readonly">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="gender">Gender *</label>
                            <select id="gender" name="gender" required>
                                <option value="">-- Select --</option>
                                <option value="Male">Male</option>
                                <option value="Female">Female</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="religion">Religion *</label>
                            <input type="text" id="religion" name="religion" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="grade_level_id">Grade Level to Enroll *</label>
                            <select id="grade_level_id" name="grade_level_id" required>
                                <option value="">-- Loading... --</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="session_id">Class Schedule / Session *</label>
                            <select id="session_id" name="session_id" required disabled>
                                <option value="">-- Select Grade Level First --</option>
                            </select>
                            <small id="schedule_note" class="form-note" style="display:none;"></small>
                        </div>
                        <div class="form-group">
                            <label for="school_year_id">School Year *</label>
                            <select id="school_year_id" name="school_year_id" required>
                                <option value="">-- Loading... --</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group" style="flex:2;">
                            <label for="house_no_street">House No. / Street *</label>
                            <input type="text" id="house_no_street" name="house_no_street" placeholder="Unit/House No., Street Name" required>
                        </div>
                        <div class="form-group">
                            <label for="barangay">Barangay *</label>
                            <input type="text" id="barangay" name="barangay" required>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="city_municipality">City / Municipality *</label>
                            <input type="text" id="city_municipality" name="city_municipality" required>
                        </div>
                        <div class="form-group">
                            <label for="province">Province *</label>
                            <input type="text" id="province" name="province" required>
                        </div>
                    </div>
                </div>

                <!-- Custom fields for Step 1 (injected dynamically by admin) -->
                <div id="custom-fields-step1"></div>

                <div class="step-actions">
                    <button type="button" class="btn btn-cancel" onclick="window.location.href='index.html'">Cancel</button>
                    <button type="submit" class="btn btn-next">Next: Parent Information</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="main.js"></script>
    <script>
        const savedData = JSON.parse(sessionStorage.getItem('enroll_data') || '{}');
        Object.keys(savedData).forEach(key => {
            const input = document.getElementById(key);
            if (input) input.value = savedData[key];
        });

        let allSessions = [];

        async function loadDropdowns() {
            try {
                const [grades, sessions, schoolYears] = await Promise.all([
                    apiGet('api/lookups.php?action=grade-levels'),
                    apiGet('api/lookups.php?action=sessions'),
                    apiGet('api/lookups.php?action=school-years')
                ]);
                allSessions = sessions;
                const gradeSelect = document.getElementById('grade_level_id');
                gradeSelect.innerHTML = '<option value="">-- Select Grade Level --</option>';
                grades.forEach(g => {
                    const sel = (savedData.grade_level_id == g.id) ? 'selected' : '';
                    gradeSelect.innerHTML += `<option value="${g.id}" ${sel}>${g.name}</option>`;
                });
                if (savedData.grade_level_id) gradeSelect.dispatchEvent(new Event('change'));
                const sySelect = document.getElementById('school_year_id');
                sySelect.innerHTML = '';
                schoolYears.forEach(sy => {
                    if (sy.is_current == 1) sySelect.innerHTML += `<option value="${sy.id}" selected>${sy.label}</option>`;
                });
            } catch (err) { console.warn('Failed to load dropdowns'); }
        }
        loadDropdowns();

        document.getElementById('birth_date').addEventListener('change', function () {
            const birthDate = new Date(this.value);
            const today = new Date();
            let age = today.getFullYear() - birthDate.getFullYear();
            const m = today.getMonth() - birthDate.getMonth();
            if (m < 0 || (m === 0 && today.getDate() < birthDate.getDate())) age--;
            document.getElementById('age').value = isNaN(age) ? '' : age;
        });

        if (savedData.birth_date) setTimeout(() => document.getElementById('birth_date').dispatchEvent(new Event('change')), 100);

        document.getElementById('grade_level_id').addEventListener('change', function (e) {
            const gradeId = e.target.value;
            const gradeName = e.target.options[e.target.selectedIndex].text;
            const schedSelect = document.getElementById('session_id');
            const note = document.getElementById('schedule_note');
            
            schedSelect.innerHTML = '';
            schedSelect.disabled = false;
            note.style.display = 'none';
            
            if (!gradeId) {
                schedSelect.innerHTML = `<option value="">-- Select Grade Level First --</option>`;
                schedSelect.disabled = true;
                return;
            }

            // Filter sessions from DB by comparing the selected grade name to the session's eligible_grades field
            const eligibleSessions = allSessions.filter(session => {
                if (!session.eligible_grades) return false;
                const gradesArray = session.eligible_grades.split(',').map(g => g.trim());
                return gradesArray.includes(gradeName);
            });

            if (eligibleSessions.length === 0) {
                schedSelect.innerHTML = `<option value="">-- No Sessions Available for ${gradeName} --</option>`;
                return;
            }

            schedSelect.innerHTML = `<option value="">-- Select Session --</option>`;
            eligibleSessions.forEach(session => {
                const sel = (savedData.session_id == session.id) ? 'selected' : '';
                schedSelect.innerHTML += `<option value="${session.id}" ${sel}>${session.name}</option>`;
            });

            // Gather and display session notes
            const notes = eligibleSessions
                .map(s => s.note)
                .filter(noteText => noteText && noteText.trim() !== '')
                .map(noteText => noteText.trim());
            if (notes.length > 0) {
                note.textContent = notes.join(' | ');
                note.style.display = 'block';
            }
        });

        document.getElementById('step1Form').addEventListener('submit', function (e) {
            e.preventDefault();
            const formData = new FormData(e.target);
            const data = JSON.parse(sessionStorage.getItem('enroll_data') || '{}');
            formData.forEach((value, key) => data[key] = value);
            // Save custom field values (non-file)
            document.querySelectorAll('#custom-fields-step1 [data-custom-field]').forEach(inp => {
                if (inp.type !== 'file') data[inp.name] = inp.value;
            });
            sessionStorage.setItem('enroll_data', JSON.stringify(data));
            window.location.href = 'enroll-parent.html';
        });

        // Load and render custom fields for step 1
        async function loadCustomFields() {
            try {
                const fields = await apiGet('api/lookups.php?action=form-fields&step=1');
                const container = document.getElementById('custom-fields-step1');
                if (!fields || fields.length === 0) return;

                let html = '<div class="form-section" style="margin-top:20px;border-top:2px dashed var(--gray-200);padding-top:16px;">';
                html += '<h4 style="margin-bottom:12px;color:var(--gray-700);">Additional Information</h4>';
                fields.forEach(f => {
                    const savedVal = savedData['custom_field_' + f.id] || '';
                    const req = f.is_required ? 'required' : '';
                    const ph = f.placeholder ? `placeholder="${f.placeholder}"` : '';
                    html += `<div class="form-group" style="margin-bottom:14px;" data-field-id="${f.id}">`;
                    html += `<label>${f.field_label}${f.is_required ? ' *' : ''}</label>`;
                    if (f.field_type === 'textarea') {
                        html += `<textarea name="custom_field_${f.id}" ${req} ${ph} data-custom-field="1" style="width:100%;min-height:80px;">${savedVal}</textarea>`;
                    } else if (f.field_type === 'select') {
                        html += `<select name="custom_field_${f.id}" ${req} data-custom-field="1">`;
                        html += `<option value="">-- Select --</option>`;
                        (f.field_options || []).forEach(opt => {
                            html += `<option value="${opt}" ${savedVal===opt?'selected':''}>${opt}</option>`;
                        });
                        html += `</select>`;
                    } else if (f.field_type === 'file') {
                        html += `<p style="font-size:12px;color:var(--gray-500);">(File upload will be available on Step 4)</p>`;
                    } else {
                        html += `<input type="${f.field_type}" name="custom_field_${f.id}" value="${savedVal}" ${req} ${ph} data-custom-field="1" style="width:100%;">`;
                    }
                    if (f.hint_text) html += `<small style="color:var(--gray-500);font-size:11px;">${f.hint_text}</small>`;
                    html += '</div>';
                });
                html += '</div>';
                container.innerHTML = html;
            } catch(e) { console.warn('Custom fields error:', e); }
        }
        loadCustomFields();
    </script>
</body>
</html>
